<!DOCTYPE HTML>
<html>

    <head>
        <title>Home Page</title>
        <link rel="stylesheet" href="../CSS/teacher.css">
    </head>

    <body>
        <div class="container">
            <h1>Create Notice</h1>
            <hr>
            <p>Notice Title: </p>
            <input type="text" id="title">
                <br>

        <p>Description: </p>
        <textarea id="description" placeholder="Enter notice description"></textarea>
        <br><br>

        <label for="category">Category: </label>

        <select id="category">
            <option>⚪ General</option>
            <option>🔵 Exam</option>
            <option>🟢 Event</option>
            <option>🟡 Holiday</option>
            <option>🔴 Emergency</option>
            <option>🟣 Assignment</option>
        </select>
        <br><br>

        <p> Deadline: </p>
        <input type="date" id="deadline">
        <br><br>

        <button id="postBtn">Post Notice</button>
        <a id="manageLink" href="manage.html">
        <button id="manageBtn">Manage Notices</button>
        </a>

       <script src="../JS/teacher.js"></script>
        </div>
    </body>

</html>
