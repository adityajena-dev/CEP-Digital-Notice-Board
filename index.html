<!DOCTYPE HTML>
<html>
    <head>
        <title>Digital Notice Board</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1>Welcome to the Digital Notice Board!</h1>
        <hr>

        <button id="createBtn">Create Group</button>
        <br>
        <button id="joinBtn">Join Group</button>

        <div id="createForm" style="display:none;">
            <h2>Create Group</h2>
            <input type="text" placeholder="Enter Group Name">
            <br><br>
            <input type="text" placeholder="Enter Group Code">
            <br><br>
            <a href="HA.html">
            <button type="submit">Create</button>
            </a>
        </div>

        <div id="joinForm" style="display:none;">
            <h2>Join Group</h2>
            <input type="text" placeholder="Enter Group Code">
            <br><br>
            <a href="SA.html">
            <button type="submit">Join</button>
            </a>
        </div>

        <script src="script.js"></script>
    </body>

</html>
